    <style>
      body {
        background: #050914;
        background-image: 
          radial-gradient(circle at 50% 0%, rgba(34,211,238,0.13) 0%, transparent 50%),
          radial-gradient(circle at 0% 50%, rgba(45,212,191,0.07) 0%, transparent 50%);
        color: #e5edf8;
        background-attachment: fixed;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
      }
      
      /* Quantum field: layered orbital geometry, readable surfaces and restrained motion */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0.15;
        background-image: linear-gradient(rgba(125, 211, 252, 0.055) 1px, transparent 1px), linear-gradient(90deg, rgba(125, 211, 252, 0.055) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: linear-gradient(to bottom, black, transparent 78%);
      }
      #root { position: relative; z-index: 1; }
      ::selection { color: #f0fdff; background: rgba(8, 145, 178, 0.48); }
      :focus-visible { outline: 2px solid #67e8f9; outline-offset: 3px; }
      button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }

      /* Recognizable quantum-vault visual language: atomic core, orbit rings, data nodes */
      .quantum-scene {
        isolation: isolate;
        perspective: 1100px;
        background: radial-gradient(ellipse at 50% 46%, rgba(8, 145, 178, .12), transparent 34%), linear-gradient(145deg, rgba(7, 16, 30, .98), rgba(5, 9, 20, .96));
      }
      .quantum-scene::before {
        content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
        background-image: radial-gradient(rgba(165, 243, 252, .46) .8px, transparent 1px), linear-gradient(rgba(103,232,249,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(103,232,249,.055) 1px, transparent 1px);
        background-size: 29px 29px, 46px 46px, 46px 46px; opacity: .34;
        mask-image: radial-gradient(ellipse at center, black 12%, transparent 80%);
      }
      .quantum-scene::after {
        content: ""; position: absolute; inset: 8% 12%; z-index: -1; pointer-events: none;
        border: 1px solid rgba(103, 232, 249, .09); border-radius: 50%; transform: rotateX(67deg) rotateZ(-12deg);
        box-shadow: 0 0 38px rgba(34,211,238,.05), inset 0 0 36px rgba(34,211,238,.035);
      }
      .quantum-core { position: relative; isolation: isolate; }
      .quantum-core::before, .quantum-core::after {
        content: ""; position: absolute; z-index: -1; left: 50%; top: 50%; border: 1px solid rgba(103,232,249,.32); border-radius: 50%;
        pointer-events: none; box-shadow: 0 0 20px rgba(34,211,238,.1);
      }
      .quantum-core::before { width: 178%; height: 60%; transform: translate(-50%,-50%) rotate(-28deg); }
      .quantum-core::after { width: 178%; height: 60%; transform: translate(-50%,-50%) rotate(28deg); border-color: rgba(45,212,191,.3); }
      .quantum-orbit { animation: quantum-orbit 18s linear infinite; transform-origin: center; }
      .quantum-orbit-reverse { animation: quantum-orbit 24s linear infinite reverse; transform-origin: center; }
      @keyframes quantum-orbit { to { transform: rotate(360deg); } }
      .quantum-panel { background: linear-gradient(150deg, rgba(12,29,47,.94), rgba(6,14,27,.92)); border-color: rgba(103,232,249,.2); box-shadow: 0 28px 90px rgba(0,0,0,.42), 0 0 60px rgba(8,145,178,.09), inset 0 1px rgba(255,255,255,.06); }
      .quantum-edge { position: relative; }
      .quantum-edge::before { content: ""; position: absolute; left: 14%; right: 14%; top: -1px; height: 1px; background: linear-gradient(90deg,transparent,#67e8f9,rgba(45,212,191,.65),transparent); box-shadow: 0 0 12px rgba(34,211,238,.58); }
      .quantum-kicker { color: #a5f3fc; letter-spacing: .22em; text-shadow: 0 0 18px rgba(34,211,238,.25); }
      .quantum-card { background: linear-gradient(145deg, rgba(15,35,55,.94), rgba(7,17,31,.92)); border: 1px solid rgba(103,232,249,.17); box-shadow: 0 18px 52px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.045); backdrop-filter: blur(16px); }
      .quantum-card:hover { border-color: rgba(103,232,249,.34); box-shadow: 0 24px 64px rgba(0,0,0,.38), 0 0 32px rgba(8,145,178,.1), inset 0 1px rgba(255,255,255,.075); }
      .quantum-inset { background: linear-gradient(135deg, rgba(13,34,53,.88), rgba(7,17,30,.88)); border: 1px solid rgba(148,214,231,.11); }
      .quantum-control { background: rgba(3,11,23,.66); border: 1px solid rgba(125,211,252,.18); box-shadow: inset 0 2px 10px rgba(0,0,0,.22); }
      .quantum-control:focus, .quantum-control:focus-within { outline: none; border-color: rgba(103,232,249,.65); box-shadow: 0 0 0 3px rgba(34,211,238,.12), inset 0 2px 10px rgba(0,0,0,.18), 0 0 24px rgba(34,211,238,.08); }
      .quantum-action { background: linear-gradient(120deg, #0e7490, #0891b2 52%, #0f766e); border: 1px solid rgba(165,243,252,.28); box-shadow: 0 8px 22px rgba(8,145,178,.2), inset 0 1px rgba(255,255,255,.15); }
      .quantum-action:hover { filter: brightness(1.13); box-shadow: 0 12px 32px rgba(8,145,178,.3), inset 0 1px rgba(255,255,255,.2); transform: translateY(-1px); }
      .quantum-label { color: #b4c9d8; letter-spacing: .12em; }
      .quantum-divider { border-color: rgba(125,211,252,.12); }
      .quantum-tile { background: linear-gradient(145deg, rgba(12,31,48,.95), rgba(7,17,31,.94)); border: 1px solid rgba(125,211,252,.14); box-shadow: inset 0 1px rgba(255,255,255,.04); }
      .quantum-tile:hover { border-color: rgba(103,232,249,.48); background: linear-gradient(145deg, rgba(10,51,68,.9), rgba(7,25,40,.96)); box-shadow: 0 8px 24px rgba(8,145,178,.12), inset 0 1px rgba(255,255,255,.08); }
      @media (max-width: 640px) { .quantum-card { backdrop-filter: blur(10px); } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
      /* Refined Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #050914; 
      }
      ::-webkit-scrollbar-thumb {
        background: #223348; 
        border: 1px solid #050914;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3b536d; 
      }

      .glass-card {
        background: rgba(11, 20, 36, 0.78);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.42);
      }
      
      .glass-input {
        background: rgba(5, 9, 20, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
      }
      .glass-input:focus {
        border-color: rgba(34, 211, 238, 0.65);
        background: rgba(5, 9, 20, 0.94);
        outline: none;
        box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.16);
      }

      .text-gradient {
        background: linear-gradient(135deg, #fff 0%, #a5f3fc 50%, #22d3ee 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 2px;
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Hide input spinners */
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
      }
      input[type=number] {
        -moz-appearance: textfield;
      }
    </style>
